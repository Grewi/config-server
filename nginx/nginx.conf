user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # заменили main на with_host
    log_format with_host '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$host"';

    access_log /var/log/nginx/access.log with_host;

    sendfile        on;
    keepalive_timeout  65;

    # ---- перенесённые server-блоки ----
    server {
        listen 8000 default_server;
        server_name _;

        root  /var/www/html;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include        fastcgi_params;
            fastcgi_pass   php:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        location / {
            default_type text/plain;
            return 200 "Default page. course.grewi is configured.\n";
        }
    }
    # -----------------------------------

    include /etc/nginx/conf.d/*.conf;
}
