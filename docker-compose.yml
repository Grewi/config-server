services:
  nginx:
    image: nginx:alpine
    container_name: main-nginx
    restart: unless-stopped
    
    # Порты
    ports:
      - "80:80"
      - "443:443"
      
    # Только конфиги (только для чтения)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      
    networks:
      - webnet

    # --- БЕЗОПАСНОСТЬ ---
    # Корневая ФС только для чтения
    read_only: true
    
    # Все, что Nginx пытается писать, уходит в RAM
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    # Сбрасываем все привилегии и оставляем только необходимые для bind на 80/443
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      
    security_opt:
      - no-new-privileges:true

    # --- ЗДОРОВЬЕ ---
    healthcheck:
      # Проверяем, что Nginx отвечает. Если нет ни одного default-сервера, 
      # он вернет 404, но wget с флагом --spider посчитает это успехом (код < 400).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

    # --- ЛОГИ И РЕСУРСЫ ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
  loki:
    image: grafana/loki:3.5.7
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - webnet

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "12345:12345"          # UI Alloy (опционально, для отладки)
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # доступ к Docker API
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    networks:
      - webnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # смените!
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - webnet

  proxydash:
    image: drarox/proxydash:latest
    container_name: proxydash
    restart: unless-stopped
    ports:
      - "3001:3000"   
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_SITES_AVAILABLE_DIR=/etc/nginx/conf.d
      - NGINX_CONFIG_PATH=/etc/nginx/nginx.conf
    networks:
      - webnet

networks:
  webnet:
    external: true

volumes:
  loki-data:
  grafana-data:
